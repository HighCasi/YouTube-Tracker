<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Kanal Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
        .bg-card { background-color: #161b22; border: 1px solid #30363d; rounded: 0.5rem; }
        .text-muted { color: #8b949e; }
        .link-hover:hover { color: #58a6ff; text-decoration: underline; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-white">YouTube RSS Tracker</h1>
        
        <div class="mb-8">
            <label for="channelSelect" class="block text-sm font-medium mb-2 text-muted">Kanal auswählen:</label>
            <select id="channelSelect" class="bg-[#0d1117] border border-[#30363d] text-[#c9d1d9] text-sm rounded focus:ring-[#58a6ff] focus:border-[#58a6ff] block w-full p-2.5 outline-none">
                <option value="" disabled selected>Bitte wählen...</option>
            </select>
        </div>

        <div id="videoContainer" class="space-y-4">
            <p class="text-muted text-sm italic">Wähle einen Kanal aus dem Dropdown, um die neuesten 5 Videos zu laden.</p>
        </div>
    </div>

    <script>
        // Mapping: Anzeigename -> YouTube Channel ID (beginnt mit UC)
        const channels = {
            "FritzMeineckeLive": "UCGRb1WmL-v6AxZRLbcdXD_Q",
            "NerdsHeaven.de": "UCJgscJUwcnegPlrQLouVlfg", // DasMonty Uncut / Hauptkanal Ersatz
            "Cliff Beats Classics": "UCka4yqPXK4DujPIsrB6xu-Q",
            "LeFloidLive": "UC8XoF1y5K_J0A10a6kQ-nkw" // LeFloid Beispiel-ID
        };

        const select = document.getElementById('channelSelect');
        const container = document.getElementById('videoContainer');

        for (const [name, id] of Object.entries(channels)) {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = name;
            select.appendChild(option);
        }

        select.addEventListener('change', (e) => {
            fetchVideos(e.target.value);
        });

        function fetchVideos(channelId) {
            container.innerHTML = '<p class="text-muted text-sm animate-pulse">Lade Videos...</p>';
            
            const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'ok') {
                        throw new Error('Feed konnte nicht geladen werden.');
                    }
                    
                    container.innerHTML = '';
                    const videos = data.items.slice(0, 5); // Die neuesten 5 Videos
                    
                    if (videos.length === 0) {
                        container.innerHTML = '<p class="text-muted text-sm">Keine Videos in diesem Feed gefunden.</p>';
                        return;
                    }

                    videos.forEach(video => {
                        const date = new Date(video.pubDate).toLocaleDateString('de-DE', {
                            day: '2-digit', month: '2-digit', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });

                        const card = document.createElement('div');
                        card.className = 'bg-card p-4 flex flex-col gap-2 transition-colors hover:border-[#58a6ff]';
                        card.innerHTML = `
                            <a href="${video.link}" target="_blank" class="text-lg font-semibold text-[#c9d1d9] link-hover line-clamp-2">
                                ${video.title}
                            </a>
                            <span class="text-xs text-muted">Hochgeladen am: ${date} Uhr</span>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    container.innerHTML = `<p class="text-red-400 text-sm">Fehler: ${error.message} <br>Bitte überprüfe, ob die Kanal-ID korrekt ist.</p>`;
                });
        }
    </script>
</body>
</html>
