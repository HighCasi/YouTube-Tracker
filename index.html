<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Channel Tracker</title>
    
    <!-- Tailwind CSS laden -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Konfiguration für ein modernes "GitHub Dark"-inspiriertes Design -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        darkBase: '#0d1117',   /* Dunkler Hintergrund */
                        darkCard: '#161b22',   /* Karten-Hintergrund */
                        darkBorder: '#30363d', /* Subtile Ränder */
                        darkHover: '#1f242c',  /* Hover-Effekte */
                        ytRed: '#FF0000',
                        accentBlue: '#58a6ff'  /* Klickbare Links */
                    }
                }
            }
        }
    </script>
    
    <!-- Inter Font für saubere Typografie -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        /* Lade-Animation (Spinner) */
        .spinner {
            border: 3px solid rgba(139, 148, 158, 0.2);
            border-radius: 50%;
            border-top: 3px solid #58a6ff;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Eigener Dropdown-Pfeil (da wir appearance-none nutzen) */
        .custom-select-wrapper::after {
            content: "▼";
            font-size: 0.8rem;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #8b949e;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <!-- Hauptcontainer -->
    <main class="w-full max-w-2xl mt-8">
        
        <!-- Header -->
        <div class="mb-8 flex items-center gap-3">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-ytRed">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <h1 class="text-2xl font-semibold text-white">YouTube RSS Tracker</h1>
        </div>

        <!-- UI Box -->
        <div class="bg-darkCard border border-darkBorder rounded-xl shadow-lg p-6">
            
            <label for="channelSelect" class="block text-sm font-medium text-gray-400 mb-2">
                Kanal auswählen
            </label>
            
            <div class="relative custom-select-wrapper mb-6">
                <!-- Dropdown Menü -->
                <select id="channelSelect" class="w-full bg-darkBase border border-darkBorder text-white rounded-lg px-4 py-3 focus:outline-none focus:border-accentBlue focus:ring-1 focus:ring-accentBlue appearance-none transition-colors cursor-pointer">
                    <option value="" disabled selected>Bitte wählen...</option>
                    <!-- Optionen werden per JavaScript generiert -->
                </select>
            </div>

            <!-- Hier werden die Videos (oder Lade-Status) reingeladen -->
            <div id="resultsContainer">
                <div class="text-center py-10 text-gray-500 text-sm">
                    Wähle oben einen Kanal aus, um die letzten 5 Videos zu sehen.
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto pt-10 pb-4 text-xs text-gray-600">
        Kein API-Key benötigt. Datenabruf via RSS-Feed.
    </footer>

    <!-- App Logic -->
    <script>
        /**
         * 1. MAPPING OBJEKT (LEICHT ANPASSBAR)
         * Hier kannst du Kanäle hinzufügen, entfernen oder ändern.
         * Format: 'Name für das Dropdown': 'UC... Kanal-ID'
         */
        const channelMapping = {
            'FritzMeineckeLive': 'UCGRb1WmL-v6AxZRLbcdXD_Q',
            'NerdsHeaven-de': 'UCd9d592s_9e8-T3a_r16Q-g', /* Trage hier die exakte UC-ID ein falls abweichend */
            'CliffBeatsClassics': 'UC33zItnIZRRtnWT8Mj9-byQ',
            'LeFloidLive': 'UCLm6s42r_wCbBX0QqXNCTwg'
        };

        // DOM Elemente referenzieren
        const selectEl = document.getElementById('channelSelect');
        const resultsContainer = document.getElementById('resultsContainer');

        /**
         * 2. INITIALISIERUNG
         * Dropdown-Menü automatisch anhand des mapping-Objekts füllen.
         */
        function initDropdown() {
            Object.keys(channelMapping).forEach(channelName => {
                const option = document.createElement('option');
                option.value = channelName;
                option.textContent = channelName;
                selectEl.appendChild(option);
            });
        }

        /**
         * 3. EVENT LISTENER
         * Reagiert auf die Auswahl im Dropdown.
         */
        selectEl.addEventListener('change', async (event) => {
            const selectedName = event.target.value;
            const channelId = channelMapping[selectedName];

            if (!channelId) return;

            // Lade-Animation anzeigen
            resultsContainer.innerHTML = `
                <div class="flex justify-center py-10">
                    <div class="spinner"></div>
                </div>
            `;

            try {
                // RSS-Feed über Proxy abrufen (Umgehung von CORS & API-Key-Zwang)
                const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
                const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error('Netzwerk-Fehler beim Abrufen der Daten.');
                }
                
                const data = await response.json();

                // Status prüfen
                if (data.status === 'ok') {
                    renderVideos(data.items);
                } else {
                    showError('Kanal konnte nicht geladen werden. Ist die UC-ID korrekt?');
                }
            } catch (error) {
                console.error(error);
                showError('Es gab ein Problem bei der Verbindung zum Server.');
            }
        });

        /**
         * 4. RENDER FUNKTION
         * Baut das HTML für die exakt 5 neuesten Videos zusammen.
         */
        function renderVideos(items) {
            // Nur die letzten 5 Videos extrahieren
            const latestVideos = items.slice(0, 5);

            if (latestVideos.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center py-6 text-gray-500 text-sm">Keine Videos gefunden.</p>';
                return;
            }

            // HTML Container für die Liste starten
            let html = '<div class="space-y-3 mt-2">';

            latestVideos.forEach(video => {
                // Titel escapen, um XSS zu verhindern
                const title = escapeHtml(video.title);
                
                // Datum schön formatieren
                const dateString = formatDate(video.pubDate);

                // Ein einzelner Video-Eintrag (Kein Thumbnail, nur Text!)
                html += `
                    <a href="${video.link}" target="_blank" rel="noopener noreferrer" 
                       class="block p-4 rounded-lg bg-darkBase border border-darkBorder hover:border-accentBlue hover:bg-darkHover transition-all group">
                        <h3 class="font-medium text-gray-200 group-hover:text-accentBlue line-clamp-2 leading-snug">
                            ${title}
                        </h3>
                        <div class="flex items-center gap-1.5 mt-2 text-xs text-gray-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            <span>${dateString} Uhr</span>
                        </div>
                    </a>
                `;
            });

            html += '</div>';
            
            // HTML in den Container injizieren
            resultsContainer.innerHTML = html;
        }

        /**
         * 5. HILFSFUNKTIONEN
         */
        
        // Fehlermeldung anzeigen
        function showError(msg) {
            resultsContainer.innerHTML = `
                <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-4 rounded-lg text-sm text-center">
                    ${msg}
                </div>
            `;
        }

        // Datum in deutsches Format umwandeln
        function formatDate(dateString) {
            if (!dateString) return 'Unbekanntes Datum';
            // .replace sorgt für iOS/Safari Kompatibilität bei RSS-Zeitstempeln
            const date = new Date(dateString.replace(' ', 'T')); 
            return date.toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // HTML Escape Funktion (Sicherheit gegen unsichere Video-Titel)
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // App starten
        document.addEventListener('DOMContentLoaded', initDropdown);

    </script>
</body>
</html>
